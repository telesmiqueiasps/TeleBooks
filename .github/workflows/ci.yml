name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  web-and-packages:
    name: Lint, Typecheck & Build (Frontend & Packages)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 12.10.1

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run Typecheck
        run: pnpm run typecheck

      - name: Run Lint
        run: pnpm run lint

      - name: Run Build
        run: pnpm run build
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://plunoacxwgwsjayzwmdl.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: sb_publishable_-6EwtyA5ZMDK1XaVkjW21A_r1rMfS_-

  api:
    name: Lint & Syntax Check (Backend API)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Linting & Test Tools
        run: |
          python -m pip install --upgrade pip
          pip install ruff

      - name: Run Ruff Lint
        run: ruff check apps/api

      - name: Validate Python Syntax
        run: python -m py_compile apps/api/main.py
