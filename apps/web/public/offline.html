<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>TeleBooks — Modo Offline</title>
  <meta name="theme-color" content="#007BFF" />
  <link rel="icon" href="/favicon.ico" />
  <style>
    :root {
      --bg: #0B0F1A;
      --card: #0F172A;
      --border: #1E293B;
      --text: #F8FAFC;
      --text-muted: #94A3B8;
      --primary: #007BFF;
      --primary-hover: #006CEB;
    }
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      background-color: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 24px;
      text-align: center;
      -webkit-font-smoothing: antialiased;
    }
    .container {
      max-width: 440px;
      width: 100%;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 28px;
      padding: 40px 28px;
      box-shadow: 0 20px 40px -15px rgba(0, 0, 0, 0.5);
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 20px;
    }
    .icon-wrapper {
      width: 80px;
      height: 80px;
      border-radius: 24px;
      background: rgba(0, 123, 255, 0.12);
      border: 1px solid rgba(0, 123, 255, 0.25);
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--primary);
      position: relative;
    }
    .icon-wrapper svg {
      width: 40px;
      height: 40px;
    }
    .status-badge {
      position: absolute;
      bottom: -4px;
      right: -4px;
      background: #EF4444;
      color: white;
      border-radius: 999px;
      padding: 4px 8px;
      font-size: 10px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      border: 2px solid var(--card);
    }
    h1 {
      font-size: 22px;
      font-weight: 800;
      letter-spacing: -0.5px;
      color: var(--text);
      line-height: 1.25;
    }
    p {
      font-size: 14px;
      line-height: 1.6;
      color: var(--text-muted);
    }
    .actions {
      display: flex;
      flex-direction: column;
      gap: 12px;
      width: 100%;
      margin-top: 8px;
    }
    .btn-primary {
      background: var(--primary);
      color: white;
      border: none;
      border-radius: 999px;
      padding: 14px 24px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      transition: all 0.2s ease;
      box-shadow: 0 8px 20px -4px rgba(0, 123, 255, 0.35);
      min-height: 48px;
    }
    .btn-primary:hover {
      background: var(--primary-hover);
      transform: translateY(-1px);
    }
    .btn-secondary {
      background: rgba(255, 255, 255, 0.05);
      color: var(--text);
      border: 1px solid var(--border);
      border-radius: 999px;
      padding: 12px 20px;
      font-size: 13px;
      font-weight: 600;
      text-decoration: none;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      transition: all 0.2s ease;
      min-height: 44px;
    }
    .btn-secondary:hover {
      background: rgba(255, 255, 255, 0.1);
    }
    .links-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      width: 100%;
      margin-top: 6px;
    }
    .footer-note {
      font-size: 12px;
      color: #64748B;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .pulse-dot {
      width: 8px;
      height: 8px;
      background: #EF4444;
      border-radius: 50%;
      display: inline-block;
      animation: pulse 2s infinite;
    }
    @keyframes pulse {
      0% { transform: scale(0.95); opacity: 0.8; }
      50% { transform: scale(1.2); opacity: 1; }
      100% { transform: scale(0.95); opacity: 0.8; }
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="icon-wrapper">
      <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
        <path stroke-linecap="round" stroke-linejoin="round" d="M12 6.253v13m0-13C10.832 5.477 9.246 5 7.5 5S4.168 5.477 3 6.253v13C4.168 18.477 5.754 18 7.5 18s3.332.477 4.5 1.253m0-13C13.168 5.477 14.754 5 16.5 5c1.747 0 3.332.477 4.5 1.253v13C19.832 18.477 18.247 18 16.5 18c-1.746 0-3.332.477-4.5 1.253" />
      </svg>
      <span class="status-badge">Offline</span>
    </div>

    <div>
      <h1>Você está sem conexão</h1>
      <p style="margin-top: 8px;">
        Não foi possível carregar esta página no momento. Suas páginas já visitadas continuam salvas no seu dispositivo.
      </p>
    </div>

    <div class="actions">
      <button class="btn-primary" onclick="window.location.reload()">
        <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.2">
          <path stroke-linecap="round" stroke-linejoin="round" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15" />
        </svg>
        Tentar Reconectar
      </button>

      <div class="links-grid">
        <a href="/" class="btn-secondary">Início</a>
        <a href="/minha-biblioteca" class="btn-secondary">Biblioteca</a>
      </div>
    </div>

    <div class="footer-note">
      <span class="pulse-dot"></span>
      <span>Aguardando sinal de rede...</span>
    </div>
  </div>

  <script>
    // Quando a rede voltar, recarrega a página automaticamente
    window.addEventListener('online', function() {
      window.location.reload();
    });
  </script>
</body>
</html>
